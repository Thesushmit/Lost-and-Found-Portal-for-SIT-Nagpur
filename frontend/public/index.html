<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#667eea" />
    <meta name="description" content="Lost and Found Portal - SIT Nagpur | Report found items and find your lost belongings" />
    <meta name="keywords" content="lost and found, SIT Nagpur, campus, student portal" />
    <meta name="author" content="SIT Nagpur" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <title>Lost & Found Portal | SIT Nagpur</title>
    
    <style>
      /* Preloader */
      .preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      
      .preloader.hidden {
        opacity: 0;
        visibility: hidden;
      }
      
      .preloader-content {
        text-align: center;
        color: white;
      }
      
      .preloader-logo {
        width: 80px;
        height: 80px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        animation: pulse-loader 1.5s infinite;
      }
      
      .preloader-logo i {
        font-size: 2.5rem;
      }
      
      .preloader-text {
        font-family: 'Poppins', sans-serif;
        font-weight: 600;
        font-size: 1.5rem;
        margin-bottom: 20px;
      }
      
      .preloader-dots {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      
      .preloader-dot {
        width: 12px;
        height: 12px;
        background: rgba(255, 255, 255, 0.5);
        border-radius: 50%;
        animation: dot-bounce 1.4s infinite ease-in-out both;
      }
      
      .preloader-dot:nth-child(1) { animation-delay: -0.32s; }
      .preloader-dot:nth-child(2) { animation-delay: -0.16s; }
      .preloader-dot:nth-child(3) { animation-delay: 0s; }
      
      @keyframes pulse-loader {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }
      
      @keyframes dot-bounce {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <!-- Preloader -->
    <div class="preloader" id="preloader">
      <div class="preloader-content">
        <div class="preloader-logo">
          <i class="bi bi-search-heart"></i>
        </div>
        <div class="preloader-text">Lost & Found</div>
        <div class="preloader-dots">
          <div class="preloader-dot"></div>
          <div class="preloader-dot"></div>
          <div class="preloader-dot"></div>
        </div>
      </div>
    </div>
    
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    
    <!-- AOS Animation Script -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      // Initialize AOS
      document.addEventListener('DOMContentLoaded', function() {
        AOS.init({
          duration: 800,
          easing: 'ease-out-cubic',
          once: true,
          offset: 50
        });
        
        // Hide preloader
        setTimeout(function() {
          document.getElementById('preloader').classList.add('hidden');
        }, 1500);
      });
    </script>
  </body>
</html>
